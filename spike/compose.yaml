# Local database for the spike only. Not used in production.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: spike
      POSTGRES_USER: spike
      POSTGRES_PASSWORD: ${SPIKE_DB_PASSWORD:-spike-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - spike-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d spike"]
      interval: 2s
      retries: 15

volumes:
  spike-db:
