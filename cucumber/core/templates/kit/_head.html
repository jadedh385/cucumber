{% comment %}
  The head every full page shares, less its title (U0.10a §4.1, §6.1): the
  stylesheet, htmx's settings as data and four deferred scripts. No inline
  script or style (AC3); data-theme stays on each shell's <html>.
{% endcomment %}{% load static page_head %}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="htmx-config" content="{% htmx_config %}">
  <link rel="stylesheet" href="{% static 'core/cucumber.css' %}">
  <script src="{% static 'core/vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'core/forms.js' %}" defer></script>
  <script src="{% static 'core/requests.js' %}" defer></script>
  <script src="{% static 'core/date-week.js' %}" defer></script>
