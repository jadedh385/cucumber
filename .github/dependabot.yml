# Weekly update proposals (U0.3 AC15). Titles start "chore(deps):" so they pass
# the pull request title check, and each one runs CI like any other PR.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Django stays on the 5.2 LTS line (ADR-0001): only 5.2.x security and bug
    # fixes are proposed. Moving to a newer Django is an Owner decision.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python-packages:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]

  # Pinned base images: Python and uv in the Dockerfile, PostgreSQL and
  # cloudflared in the server compose file (U0.4a design §9).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "docker-compose"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
