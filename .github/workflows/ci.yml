# Every check on every pull request and every push to main (U0.3 AC1-AC4).
# GitHub can't block a red merge on our plan: the merge rule is that the Owner
# merges only with Claude, after every job here is green.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    # Fake values so settings load. They protect nothing: CI's database is
    # thrown away after each run.
    env:
      DJANGO_ENVIRONMENT: local
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: cucumber
      DB_USER: cucumber_owner
      DB_PASSWORD: ci-only-not-a-secret-owner
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_OWNER_PASSWORD: ci-only-not-a-secret-owner
      DB_APP_PASSWORD: ci-only-not-a-secret-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install Python packages
        run: uv sync --locked

      - name: Install the test browser
        run: uv run playwright install --with-deps chromium

      # The pinned Tailwind CLI that check.sh builds the CSS with (U0.10a
      # §3.3): downloaded again only when css.py (its version, hashes) changes.
      - name: Cache the Tailwind CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/tools
          key: tailwind-${{ runner.os }}-${{ hashFiles('scripts/css.py') }}

      - name: Create the database roles
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: ci-only-not-a-secret-postgres
        run: docker/postgres/init/01-roles.sh

      - name: Run every check
        run: scripts/check.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      # AC1: the image still builds for Intel, so staging or production can
      # move off the MacBook without code changes.
      - name: Build the image for Intel
        run: docker build --platform linux/amd64 -t cucumber-ci .

      - name: Check it runs as non-root with no settings baked in
        run: |
          set -euo pipefail
          user="$(docker inspect --format '{{.Config.User}}' cucumber-ci)"
          [ "$user" = "cucumber" ] || { echo "runs as '$user', not cucumber"; exit 1; }
          if docker inspect --format '{{json .Config.Env}}' cucumber-ci | grep -Eq '"(DJANGO|DB)_'; then
            echo "the image's environment holds a setting"; exit 1
          fi

      # AC7: with fake production values; warnings fail it too.
      - name: Run Django's deploy check inside the image
        run: |
          docker run --rm \
            -e DJANGO_ENVIRONMENT=production \
            -e DJANGO_SECRET_KEY="ci-only-not-a-secret-$(printf 'k%.0s' {1..40})" \
            -e DJANGO_ALLOWED_HOSTS=example.invalid \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://example.invalid \
            -e DB_USER=cucumber_app -e DB_PASSWORD=ci-only-not-a-secret \
            cucumber-ci python manage.py check --deploy --fail-level WARNING

      # Deploy rehearsal: this pull request's own code, as staging.
      # In the runner's temp folder; later steps find it through CUCUMBER_HOME.
      - name: Set up a pretend staging server
        run: |
          echo "CUCUMBER_HOME=$RUNNER_TEMP/cucumber" >> "$GITHUB_ENV"
          CUCUMBER_HOME="$RUNNER_TEMP/cucumber" scripts/rehearse_deploy.sh setup

      - name: Deploy this checkout to it
        run: uv run --no-dev python -m scripts.deploy staging main --source "$GITHUB_WORKSPACE"

      - name: Check what staff and the server would see
        run: scripts/rehearse_deploy.sh check

      - name: Deploy again and find no database changes
        run: |
          set -euo pipefail
          sleep $((61 - $(date +%-S)))   # copies are named to the minute; never overwritten
          uv run --no-dev python -m scripts.deploy staging main --source "$GITHUB_WORKSPACE" | tee second.log
          grep -q "Updating the database (no changes)" second.log
